<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="Mapa urbano con reportes de baches">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="avenue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
    <filter id="pinShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#020617" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="800" height="560" rx="24" fill="url(#bg)"/>

  <g opacity="0.9">
    <rect x="40" y="46" width="150" height="96" rx="10" fill="#1e293b"/>
    <rect x="222" y="46" width="196" height="96" rx="10" fill="#1e293b"/>
    <rect x="450" y="46" width="128" height="96" rx="10" fill="#1e293b"/>
    <rect x="610" y="46" width="150" height="96" rx="10" fill="#1e293b"/>

    <rect x="40" y="174" width="196" height="118" rx="10" fill="#1e293b"/>
    <rect x="268" y="174" width="150" height="118" rx="10" fill="#1e293b"/>
    <rect x="450" y="174" width="310" height="118" rx="10" fill="#1e293b"/>

    <rect x="40" y="324" width="150" height="100" rx="10" fill="#1e293b"/>
    <rect x="222" y="324" width="196" height="100" rx="10" fill="#1e293b"/>
    <rect x="450" y="324" width="128" height="100" rx="10" fill="#1e293b"/>
    <rect x="610" y="324" width="150" height="100" rx="10" fill="#1e293b"/>

    <rect x="40" y="456" width="286" height="66" rx="10" fill="#1e293b"/>
    <rect x="358" y="456" width="150" height="66" rx="10" fill="#1e293b"/>
    <rect x="540" y="456" width="220" height="66" rx="10" fill="#1e293b"/>
  </g>

  <g fill="none" stroke="#334155" stroke-width="22" stroke-linecap="round">
    <path d="M202 30 V530"/>
    <path d="M432 30 V530"/>
    <path d="M588 30 V530"/>
    <path d="M24 158 H776"/>
    <path d="M24 306 H776"/>
    <path d="M24 442 H776"/>
  </g>

  <path d="M-20 500 C 180 380, 260 360, 420 250 S 700 90, 830 40"
        fill="none" stroke="url(#avenue)" stroke-width="34" stroke-linecap="round"/>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b" letter-spacing="1">
    <text x="214" y="140" transform="rotate(-90 214 140)">AV. CENTRAL</text>
    <text x="500" y="300">VÍA PANAMÁ</text>
    <text x="620" y="430" transform="rotate(-28 620 430)">CORREDOR SUR</text>
  </g>

  <g filter="url(#pinShadow)">
    <g transform="translate(292 238)">
      <circle r="21" fill="#ffffff"/>
      <circle r="15" fill="#ef4444"/>
      <circle r="5" fill="#ffffff"/>
    </g>
    <g transform="translate(516 128)">
      <circle r="18" fill="#ffffff"/>
      <circle r="12" fill="#f59e0b"/>
      <circle r="4" fill="#ffffff"/>
    </g>
    <g transform="translate(660 350)">
      <circle r="19" fill="#ffffff"/>
      <circle r="13" fill="#22c55e"/>
      <circle r="4" fill="#ffffff"/>
    </g>
    <g transform="translate(140 390)">
      <circle r="17" fill="#ffffff"/>
      <circle r="11" fill="#f59e0b"/>
      <circle r="4" fill="#ffffff"/>
    </g>
  </g>

  <g filter="url(#shadow)" transform="translate(496 418)">
    <rect width="266" height="94" rx="16" fill="#ffffff"/>
    <circle cx="34" cy="34" r="16" fill="#d1fae5"/>
    <path d="M27 34 l5 5 l10 -11" fill="none" stroke="#059669" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="62" y="32" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Reporte verificado</text>
    <text x="62" y="54" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">Av. Central · Panamá</text>
    <rect x="18" y="70" width="230" height="6" rx="3" fill="#e2e8f0"/>
    <rect x="18" y="70" width="156" height="6" rx="3" fill="#4f46e5"/>
  </g>
</svg>
